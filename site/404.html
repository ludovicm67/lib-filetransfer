<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — lost in transit · lib-filetransfer</title>
    <meta name="robots" content="noindex" />
    <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <!-- Apply the saved theme before paint to avoid a flash. -->
    <script data-cfasync="false">
      (function () {
        var t = localStorage.getItem("lft-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <style>
      .err-page { display: flex; flex-direction: column; min-height: 100vh; }
      .err-main {
        flex: 1; position: relative; overflow: hidden;
        display: grid; place-items: center; text-align: center; padding: 48px 24px;
      }
      .err-glow {
        position: absolute; inset: -20% -10% auto -10%; height: 560px; z-index: 0; pointer-events: none;
        background:
          radial-gradient(closest-side, rgba(56, 189, 248, 0.18), transparent) 20% 25% / 55% 80% no-repeat,
          radial-gradient(closest-side, rgba(192, 132, 252, 0.16), transparent) 80% 15% / 55% 80% no-repeat,
          radial-gradient(closest-side, rgba(129, 140, 248, 0.14), transparent) 50% 55% / 60% 90% no-repeat;
        filter: blur(6px);
      }
      .err-inner { position: relative; z-index: 1; max-width: 560px; }
      .err-code {
        font-size: clamp(5.5rem, 20vw, 11rem); font-weight: 800; line-height: 0.95;
        letter-spacing: -0.04em; margin: 6px 0 4px;
      }
      .err-title { font-size: clamp(1.4rem, 3.6vw, 2.1rem); margin: 8px 0 14px; letter-spacing: -0.02em; }
      .err-msg { color: var(--text-muted); font-size: 1.06rem; margin: 0 auto 32px; max-width: 46ch; }
      .err-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

      /* On-brand "lost packet" illustration. */
      .err-illus { position: relative; width: 260px; height: 76px; margin: 0 auto; }
      .err-wire {
        position: absolute; top: 50%; left: 22px; right: 22px; height: 2px; transform: translateY(-50%);
        background: repeating-linear-gradient(90deg, var(--border-strong) 0 8px, transparent 8px 16px);
      }
      .err-end { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translateY(-50%); }
      .err-end.s { left: 12px; background: var(--sky); box-shadow: 0 0 10px var(--sky); }
      .err-end.r { right: 12px; background: var(--violet); box-shadow: 0 0 10px var(--violet); }
      .err-pkt {
        position: absolute; top: 50%; left: 22px; width: 20px; height: 15px; border-radius: 4px; margin-top: -7.5px;
        display: grid; place-items: center; background: var(--indigo); box-shadow: 0 0 12px rgba(129, 140, 248, 0.7);
        animation: errLost 3.2s ease-in infinite;
      }
      .err-pkt::after {
        content: "✗"; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
        font-size: 12px; font-weight: 800; color: var(--drop); opacity: 0; animation: errMark 3.2s ease-in infinite;
      }
      @keyframes errLost {
        0% { left: 22px; opacity: 0; background: var(--indigo); transform: translateY(0) rotate(0); }
        10% { opacity: 1; }
        42% { left: 47%; opacity: 1; background: var(--indigo); transform: translateY(0) rotate(0); }
        52% { background: var(--drop); box-shadow: 0 0 12px var(--drop); }
        76% { left: 47%; opacity: 0; background: var(--drop); transform: translateY(40px) rotate(20deg); }
        100% { left: 47%; opacity: 0; }
      }
      @keyframes errMark {
        0%, 44% { opacity: 0; } 52%, 70% { opacity: 1; } 80%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .err-pkt, .err-pkt::after { animation: none; }
        .err-pkt { left: 47%; background: var(--drop); }
      }
    </style>
  </head>
  <body>

      <!-- Header (mirrors the landing page) -->

                <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#38bdf8" />
                  <stop offset="0.5" stop-color="#818cf8" />
                  <stop offset="1" stop-color="#c084fc" />
                </linearGradient>
              </defs>
              <rect x="2" y="7" width="10" height="10" rx="2.5" fill="url(#g-brand)" />
              <rect x="20" y="15" width="10" height="10" rx="2.5" fill="url(#g-brand)" opacity="0.55" />

            </svg>

          <nav class="header-nav" aria-label="Primary">

              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
                <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.28 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z" />
              </svg>
            </a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
              <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-13a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1Zm0 15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1ZM4 11a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2h1Zm17 0a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1ZM5.6 5.6a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4Zm11 11a1 1 0 0 1 1.4 0l.7.7a1 1 0 0 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4Zm1.4-11a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0Zm-11 11a1 1 0 0 1 0 1.4l-.7.7a1 1 0 0 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0Z"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            </button>
          </nav>
        </div>
      </header>

      <!-- 404 body -->
      <main class="err-main">
        <div class="err-glow" aria-hidden="true"></div>
        <div class="err-inner">
          <div class="err-illus" aria-hidden="true">
            <span class="err-wire"></span>
            <span class="err-end s"></span>
            <span class="err-end r"></span>
            <span class="err-pkt"></span>
          </div>
          <h1 class="err-code grad">404</h1>
          <h2 class="err-title">This page got lost in transit.</h2>
          <p class="err-msg">
            The chunk you asked for never arrived — and even our retry mechanism
            couldn't recover this one. Let's get you back on a healthy connection.
          </p>
          <div class="err-cta">
            <a class="btn btn-primary" href="/">Back to home</a>
            <a class="btn btn-ghost" href="/api/">API reference</a>
            <a class="btn btn-ghost" href="https://github.com/ludovicm67/lib-filetransfer/issues">Report an issue</a>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <div class="wrap footer-bottom">
          <span>MIT License</span>
          <span>Built by <a href="https://ludovic-muller.fr/">Ludovic Muller</a></span>
        </div>
      </footer>
    </div>

    <script data-cfasync="false">
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var root = document.documentElement;
        var current =
          root.getAttribute("data-theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("lft-theme", next);
      });
    </script>
  </body>
</html>
